<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1220" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="FINOVEXA AI — autonomous business manager, money recovery, cash-flow forecasting and market intelligence for small businesses."
    />
    <title>FINOVEXA AI · Autonomous Business Manager</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("finovexa_theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#050b16" : "#f4f7fc");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot__inner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; text-align: center; }
      .boot__mark {
        display: block;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        object-fit: cover;
        object-position: 26% 42%;
        box-shadow: 0 10px 24px -12px rgba(29, 95, 214, 0.8);
      }
      .boot__title { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .boot__text { margin: 0; font-size: 12px; color: #64748b; }
      .boot__bar { display: block; width: 120px; height: 3px; margin-top: 4px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
      .boot__bar span { display: block; width: 45%; height: 100%; border-radius: 999px; background: #2478f0; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot__hint { margin: 6px 0 0; font-size: 10px; color: #94a3b8; }
      html[data-theme="dark"] .boot { background: #050b16; color: #e9f0fa; }
      html[data-theme="dark"] .boot__text { color: #8fa2ba; }
      html[data-theme="dark"] .boot__bar { background: #16243a; }
      html[data-theme="dark"] .boot__hint { color: #64748b; }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__inner">
          <img class="boot__mark" src="/branding/finovexa-mark.png" alt="" aria-hidden="true" />
          <p class="boot__title">FINOVEXA AI</p>
          <p class="boot__text">Loading your workspace…</p>
          <span class="boot__bar" aria-hidden="true"><span></span></span>
          <p class="boot__hint">Free hosting may take up to a minute to wake. If this stays stuck, refresh the page.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
