name: finovexa

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: finovexa-api:latest
    container_name: finovexa-api
    restart: unless-stopped
    env_file:
      - /opt/finovexa/env/api.env
    environment:
      TZ: Asia/Kolkata
    ports:
      # Loopback only: the public entry point is Caddy or cloudflared on the host.
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/finovexa/data:/app/data
    mem_limit: 700m
    cpus: 1.50
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=4)'
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
